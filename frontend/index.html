<!DOCTYPE html>
<html>
<head>
    <title>Online C Compiler</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        h2 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1f2937;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #374151;
        }

        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #111827;
            color: #00ff88;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
            overflow-y: auto;
            font-family: monospace;
        }

        .error {
            color: #ff4d4d;
        }
    </style>
</head>

<body>

<h2>🔥 Online C Compiler</h2>

<textarea id="code">
#include <stdio.h>

int main() {
    printf("Hello Raju!");
    return 0;
}
</textarea>

<br>
<button onclick="runCode()">Run</button>

<h3>Output</h3>
<div id="output" class="output-box"></div>

<script>
function runCode() {
    const code = document.getElementById("code").value;
    const outputBox = document.getElementById("output");

    outputBox.textContent = "Running...";
    outputBox.classList.remove("error");

    fetch("http://localhost:3000/run", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
    })
    .then(res => res.json())
    .then(data => {
        if (data.output) {
            outputBox.textContent = data.output;
        } else {
            outputBox.textContent = data.error;
            outputBox.classList.add("error");
        }
    })
    .catch(err => {
        outputBox.textContent = "Server Error";
        outputBox.classList.add("error");
    });
}
</script>

</body>
</html>
